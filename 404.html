<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10191f" />
    <meta name="robots" content="noindex" />
    <title>Off the map · Loop Courier</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #10191f; color: #f0f2e9; }
      main { max-width: 34rem; }
      svg { width: 48px; height: 48px; color: #d7f58e; margin-bottom: 28px; }
      .code { color: #9aacb3; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font-size: clamp(30px, 6vw, 44px); font-weight: 720; line-height: 1.05; letter-spacing: -.05em; }
      p { margin: 0; color: #9aacb3; font-size: 16px; line-height: 1.55; }
      a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 28px; padding: 0 20px; border-radius: 5px; background: #d7f58e; color: #10191f; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 2px solid #d7f58e; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M13 12h21v24H13V12Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 5" />
        <circle cx="13" cy="12" r="5" fill="currentColor" />
      </svg>
      <div class="code">404 · no such stop</div>
      <h1>This street isn't on the route.</h1>
      <p>The page you asked for doesn't exist. The city is still running.</p>
      <a href="/">Back to the map</a>
    </main>
  </body>
</html>
